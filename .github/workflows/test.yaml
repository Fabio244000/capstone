name: Run Tests

on:
  push: 
    branches:
      - main
    paths:
      - services/**
      - github/workflows/test.yaml
  pull_request:
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/utils/file-filters.yaml
  test:
    needs: filter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.filter.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js environment
        if: ${{ startsWith(matrix.service, 'services/node/') || startsWith(matrix.service, 'services/react/') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.service }}/package.json
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Setup go environment
        if: ${{ startsWith(matrix.service, 'services/go/') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.1.0
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.mod
      - name: Install poetry
        if: ${{ startsWith(matrix.service, 'services/python/') }}
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.1
      - name: Install python
        if: ${{ startsWith(matrix.service, 'services/python/') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: ${{ matrix.service }}/pyproject.toml
          cache: poetry
          cache-dependency-path: ${{ matrix.service }}/poetry.lock
        # TODO: use specific version + setup caching
      - name: Install task
        uses: supplypike/setup-bin@73f5356f4d8a8588c525365fad26435ee1de4eaa # v5
        with:
          uri: "https://github.com/go-task/task/releases/download/v3.54.0/task_linux_amd64.tar.gz"
          name: task
          version: v3.54.0
      - name: Install app deps
        working-directory: ${{ matrix.service }}
        run:
          task install-ci
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run:
          task test